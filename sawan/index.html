<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- PubNub SDK -->
  <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
  <!-- Font Awesome CDN Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; color: #fff; }

    #radarCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; cursor: pointer;
    }

    .top-controls {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; align-items: center; gap: 12px;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px);
      border: 1px solid rgba(6, 182, 212, 0.4); padding: 8px 18px; border-radius: 30px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.6);
    }
    .profile-chip { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .profile-chip img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid #06b6d4; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; }
    .status-dot.active { background: #10b981; box-shadow: 0 0 10px #10b981; }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(14px);
      z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-box {
      background: #0f172a; border: 1px solid rgba(6, 182, 212, 0.4); border-radius: 24px; padding: 25px; width: 100%; max-width: 360px; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .modal-box input[type="text"] {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); color: #fff; margin: 15px 0; outline: none; text-align: center;
    }
    .avatar-preview {
      width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 3px solid #06b6d4; background: rgba(255,255,255,0.1); margin-bottom: 10px;
    }
    .upload-btn {
      background: rgba(255,255,255,0.1); border: 1px dashed rgba(6,182,212,0.6); padding: 8px 14px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: 600; display: inline-block;
    }

    .btn {
      background: linear-gradient(135deg, #06b6d4, #3b82f6); border: none; color: #fff; padding: 12px 20px;
      font-size: 14px; border-radius: 25px; cursor: pointer; transition: 0.3s; width: 100%; font-weight: 600; margin-top: 10px;
    }
    .btn:hover { opacity: 0.9; }

    .file-transfer-panel {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
      z-index: 10; width: 90%; max-width: 400px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);
      border: 1px solid rgba(6, 182, 212, 0.4); border-radius: 24px; padding: 20px; text-align: center; display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    input[type="file"] { display: none; }
    .file-label {
      background: rgba(255,255,255,0.1); padding: 12px; border-radius: 14px; cursor: pointer; display: block; font-size: 14px; font-weight: 500;
    }
    progress { width: 100%; height: 8px; border-radius: 4px; margin-top: 10px; accent-color: #06b6d4; }

    #floatingDisconnectBtn {
      position: absolute; z-index: 20; display: none; width: 28px; height: 28px;
      background: #ef4444; color: #fff; border-radius: 50%; border: 2px solid #fff;
      align-items: center; justify-content: center; cursor: pointer;
      box-shadow: 0 4px 10px rgba(239, 68, 68, 0.5); font-size: 13px;
    }
    #floatingDisconnectBtn:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <canvas id="radarCanvas"></canvas>

  <div id="floatingDisconnectBtn" onclick="disconnectCurrentPeer(false)">
    <i class="fa-solid fa-xmark"></i>
  </div>

  <div class="top-controls">
    <div class="status-dot" id="statusDot"></div>
    <div class="profile-chip" onclick="openProfileModal()">
      <img id="headerAvatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Default">
      <span id="headerName" style="font-size:13px; font-weight:600;">Setup DP</span>
    </div>
  </div>

  <div class="modal-overlay" id="profileModal" style="display:none;">
    <div class="modal-box">
      <h3 style="color:#06b6d4;"><i class="fa-solid fa-id-card"></i> Profile & HD DP</h3>
      <p style="font-size: 12px; opacity: 0.7; margin-top: 4px;">Gallery</p>
      
      <div style="margin-top: 15px;">
        <img id="modalAvatarPreview" class="avatar-preview" src="https://api.dicebear.com/7.x/bottts/svg?seed=Default">
        <br>
        <label class="upload-btn">
          <i class="fa-solid fa-camera"></i> Gallery Photo Select
          <input type="file" id="avatarFileInput" accept="image/*" onchange="previewGalleryImage(event)">
        </label>
      </div>

      <input type="text" id="nameInput" placeholder="Apna Naam Likhein...">

      <button class="btn" onclick="saveProfile()"><i class="fa-solid fa-circle-check"></i> Save & Start Radar</button>
    </div>
  </div>

  <div class="file-transfer-panel" id="transferSection">
    <p style="font-size: 13px; color: #10b981; font-weight: bold; margin-bottom: 10px;" id="connectionStatusText">
      <i class="fa-solid fa-link"></i> Connected....!
    </p>
    <label class="file-label">
      <i class="fa-solid fa-folder-open"></i> File Chunein (Photo, Video, PDF, Audio)
      <input type="file" id="fileInput" onchange="sendFile(event)">
    </label>
    <p id="fileNameDisplay" style="font-size: 11px; margin-top: 6px; word-break: break-all; opacity: 0.8;"></p>
    <progress id="transferProgress" value="0" max="100" style="display:none;"></progress>
    <div id="downloadContainer"></div>
  </div>

  <script>
    const myId = "node_" + Math.random().toString(36).substring(7);
    let myName = localStorage.getItem("p2p_user_name") || "";
    let myAvatar = localStorage.getItem("p2p_user_avatar_base64") || "https://api.dicebear.com/7.x/bottts/svg?seed=Default";
    let tempAvatarBase64 = myAvatar;

    const pubnub = new PubNub({
      publishKey: "demo",
      subscribeKey: "demo",
      userId: myId
    });

    const globalDiscoveryChannel = "p2p_live_radar_channel_v11";
    let peerConnection;
    let dataChannel;
    let isConnected = false;
    let activeConnectedPeerId = null;
    const rtcConfig = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    const activePeers = new Map();
    const PEER_TIMEOUT_MS = 3000;

    let canvas, ctx;
    let sweepAngle = 0;
    let myLat = 0, myLon = 0;

    let incomingFileMeta = {};
    let incomingBuffer = [];
    let receivedSize = 0;

    window.onload = function() {
      initCanvas();
      if (!myName) {
        openProfileModal();
      } else {
        updateProfileUI();
        startRadarEngine();
      }
    };

    function initCanvas() {
      canvas = document.getElementById('radarCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      canvas.addEventListener('click', handleCanvasClick);
      requestAnimationFrame(renderRadar);
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function openProfileModal() {
      document.getElementById('nameInput').value = myName;
      document.getElementById('modalAvatarPreview').src = myAvatar;
      tempAvatarBase64 = myAvatar;
      document.getElementById('profileModal').style.display = "flex";
    }

    function previewGalleryImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function() {
          const cvs = document.createElement('canvas');
          const c = cvs.getContext('2d');
          const maxW = 150;
          const scale = maxW / img.width;
          cvs.width = maxW;
          cvs.height = img.height * scale;
          c.drawImage(img, 0, 0, cvs.width, cvs.height);
          tempAvatarBase64 = cvs.toDataURL('image/jpeg', 0.85);
          document.getElementById('modalAvatarPreview').src = tempAvatarBase64;
        };
      };
      reader.readAsDataURL(file);
    }

    function saveProfile() {
      const name = document.getElementById('nameInput').value.trim();
      if (!name) { alert("Naam dalna anivarya hai!"); return; }
      myName = name;
      myAvatar = tempAvatarBase64;
      localStorage.setItem("p2p_user_name", myName);
      localStorage.setItem("p2p_user_avatar_base64", myAvatar);
      updateProfileUI();
      document.getElementById('profileModal').style.display = "none";
      if (myLat !== 0) startRadarEngine();
    }

    function updateProfileUI() {
      document.getElementById('headerName').innerText = myName;
      document.getElementById('headerAvatar').src = myAvatar;
    }

    function startRadarEngine() {
      if (!navigator.geolocation) { alert("GPS Support nahi hai!"); return; }

      pubnub.subscribe({ channels: [globalDiscoveryChannel, myId] });

      navigator.geolocation.watchPosition(
        (pos) => {
          myLat = pos.coords.latitude;
          myLon = pos.coords.longitude;
          document.getElementById('statusDot').classList.add('active');
          broadcastHeartbeat();
        },
        (err) => console.error(err),
        { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
      );

      setInterval(() => {
        if (myLat !== 0) broadcastHeartbeat();
      }, 2000);

      setInterval(cleanupDeadPeers, 1000);
    }

    function broadcastHeartbeat() {
      pubnub.publish({
        channel: globalDiscoveryChannel,
        message: { type: 'HEARTBEAT', sender: myId, name: myName, avatar: myAvatar, lat: myLat, lon: myLon }
      });
    }

    window.addEventListener('beforeunload', () => {
      pubnub.publish({
        channel: globalDiscoveryChannel,
        message: { type: 'DISCONNECT', sender: myId }
      });
      disconnectCurrentPeer(true);
    });

    pubnub.addListener({
      message: async (event) => {
        const msg = event.message;
        if (msg.sender === myId) return;

        if (msg.type === 'DISCONNECT') {
          activePeers.delete(msg.sender);
          if (activeConnectedPeerId === msg.sender) {
            disconnectCurrentPeer(true);
          }
          return;
        }

        if (msg.type === 'HEARTBEAT' && msg.name) {
          let peer = activePeers.get(msg.sender);
          if (!peer) {
            const imgObj = new Image();
            imgObj.src = msg.avatar || "https://api.dicebear.com/7.x/bottts/svg?seed=" + msg.name;

            let validPos = false;
            let angle = 0, radius = 0;
            let attempts = 0;

            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            const maxR = Math.min(cx, cy) * 0.75;

            while (!validPos && attempts < 20) {
              attempts++;
              angle = Math.random() * Math.PI * 2;
              radius = 90 + Math.random() * (maxR - 90);
              
              const testX = cx + Math.cos(angle) * radius;
              const testY = cy + Math.sin(angle) * radius;

              validPos = true;
              for (let existing of activePeers.values()) {
                if (existing.x && existing.y) {
                  const dist = Math.hypot(testX - existing.x, testY - existing.y);
                  if (dist < 70) {
                    validPos = false;
                    break;
                  }
                }
              }
            }

            peer = {
              id: msg.sender,
              name: msg.name,
              avatarImg: imgObj,
              angle: angle,
              radius: radius,
              x: 0,
              y: 0,
              lastSeen: Date.now()
            };
          } else {
            peer.lastSeen = Date.now();
            peer.name = msg.name;
          }
          activePeers.set(msg.sender, peer);
        }

        if (msg.target === myId) {
          if (!peerConnection) setupPeerConnection(msg.sender);

          if (msg.type === 'offer' && !isConnected) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            activeConnectedPeerId = msg.sender;
            pubnub.publish({ channel: msg.sender, message: { type: 'answer', answer: answer, sender: myId, target: msg.sender } });
          } else if (msg.type === 'answer' && !isConnected) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(msg.answer));
          } else if (msg.candidate) {
            try { await peerConnection.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
          }
        }
      }
    });

    function cleanupDeadPeers() {
      const now = Date.now();
      for (let [id, peer] of activePeers.entries()) {
        if (now - peer.lastSeen > PEER_TIMEOUT_MS) {
          activePeers.delete(id);
          if (activeConnectedPeerId === id) {
            disconnectCurrentPeer(true);
          }
        }
      }
    }

    function renderRadar() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const maxRadius = Math.min(cx, cy) * 0.85;

      ctx.strokeStyle = "rgba(6, 182, 212, 0.2)";
      ctx.lineWidth = 1;
      for (let r = 0.3; r <= 1; r += 0.35) {
        ctx.beginPath();
        ctx.arc(cx, cy, maxRadius * r, 0, Math.PI * 2);
        ctx.stroke();
      }

      sweepAngle += 0.025;
      if (sweepAngle > Math.PI * 2) sweepAngle = 0;

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, maxRadius, sweepAngle - 0.3, sweepAngle);
      ctx.closePath();
      const sweepGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxRadius);
      sweepGrad.addColorStop(0, "rgba(6, 182, 212, 0.35)");
      sweepGrad.addColorStop(1, "rgba(6, 182, 212, 0)");
      ctx.fillStyle = sweepGrad;
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.strokeStyle = "#06b6d4";
      ctx.lineWidth = 3;
      ctx.fillStyle = "#020617";
      ctx.fill();
      ctx.stroke();

      let isAnyConnected = false;

      for (let peer of activePeers.values()) {
        let px, py;
        const isConnectedPeer = (peer.id === activeConnectedPeerId);

        if (isConnectedPeer) {
          px = cx;
          py = cy;
          isAnyConnected = true;
        } else {
          px = cx + Math.cos(peer.angle) * peer.radius;
          py = cy + Math.sin(peer.angle) * peer.radius;
        }
        peer.x = px;
        peer.y = py;

        ctx.beginPath();
        ctx.arc(px, py, isConnectedPeer ? 32 : 22, 0, Math.PI * 2);
        ctx.strokeStyle = isConnectedPeer ? "#06b6d4" : "#10b981";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, isConnectedPeer ? 28 : 19, 0, Math.PI * 2);
        ctx.clip();
        if (peer.avatarImg && peer.avatarImg.complete) {
          ctx.drawImage(peer.avatarImg, px - (isConnectedPeer ? 28 : 19), py - (isConnectedPeer ? 28 : 19), isConnectedPeer ? 56 : 38, isConnectedPeer ? 56 : 38);
        } else {
          ctx.fillStyle = "#10b981";
          ctx.fill();
        }
        ctx.restore();

        if (isConnectedPeer) {
          const btn = document.getElementById('floatingDisconnectBtn');
          btn.style.left = (px + 12) + "px";
          btn.style.top = (py - 24) + "px";
          btn.style.display = "flex";
        }

        if (!isConnectedPeer) {
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 12px 'Segoe UI', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          ctx.fillText(peer.name, px, py + 38);
        }
      }

      if (!isAnyConnected) {
        document.getElementById('floatingDisconnectBtn').style.display = "none";
      }

      requestAnimationFrame(renderRadar);
    }

    function handleCanvasClick(e) {
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let peer of activePeers.values()) {
        const dx = clickX - peer.x;
        const dy = clickY - peer.y;
        
        if (Math.hypot(dx, dy) <= 28) {
          if (isConnected && activeConnectedPeerId && activeConnectedPeerId !== peer.id) {
            const confirmSwitch = confirm("Pehle se ek peer connected hai! Kya aap purane connection ko disconnect karke naye bande se judna chahte hain?");
            if (!confirmSwitch) return;
            disconnectCurrentPeer(true);
          }
          connectToPeer(peer.id);
          break;
        }
      }
    }

    function connectToPeer(targetId) {
      activeConnectedPeerId = targetId;
      setupPeerConnection(targetId);
      createDataChannel(targetId);

      peerConnection.createOffer().then(offer => {
        peerConnection.setLocalDescription(offer);
        pubnub.publish({ channel: targetId, message: { type: 'offer', offer: offer, sender: myId, target: targetId } });
      });
    }

    function setupPeerConnection(targetId) {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          pubnub.publish({ channel: targetId, message: { candidate: event.candidate, sender: myId, target: targetId } });
        }
      };

      peerConnection.ondatachannel = (event) => {
        dataChannel = event.channel;
        bindDataChannelEvents();
        document.getElementById('transferSection').style.display = "block";
      };
    }

    function createDataChannel(targetId) {
      if (dataChannel) { dataChannel.close(); dataChannel = null; }
      // Reliable data channel configured with buffer optimizations
      dataChannel = peerConnection.createDataChannel("file-transfer", { ordered: true });
      bindDataChannelEvents();
    }

    function bindDataChannelEvents() {
      dataChannel.onopen = () => {
        isConnected = true;
        document.getElementById('transferSection').style.display = "block";
      };
      dataChannel.onclose = () => {
        isConnected = false;
        disconnectCurrentPeer(true);
      };
      dataChannel.onmessage = (event) => { handleIncomingData(event.data); };
    }

    function disconnectCurrentPeer(silent = false) {
      if (dataChannel) { 
        try { dataChannel.close(); } catch(e){} 
        dataChannel = null; 
      }
      if (peerConnection) { 
        try { peerConnection.close(); } catch(e){} 
        peerConnection = null; 
      }
      isConnected = false;
      activeConnectedPeerId = null;
      document.getElementById('floatingDisconnectBtn').style.display = "none";
      document.getElementById('transferSection').style.display = "none";
      document.getElementById('downloadContainer').innerHTML = "";
      document.getElementById('transferProgress').value = 0;
      document.getElementById('fileNameDisplay').innerText = "";
      if (!silent) alert("Connection disconnected successfully!");
    }

    function sendFile(event) {
      if (!dataChannel || dataChannel.readyState !== "open") {
        alert("Connection lost! Please reconnect.");
        disconnectCurrentPeer(true);
        return;
      }

      const file = event.target.files[0];
      if (!file) return;

      document.getElementById('fileNameDisplay').innerText = `Sending: ${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;
      const progressBar = document.getElementById('transferProgress');
      progressBar.style.display = "block";
      progressBar.value = 0;

      const meta = { type: 'META', name: file.name, size: file.size, fileType: file.type };
      dataChannel.send(JSON.stringify(meta));

      // Safe Chunk Size (8KB) to prevent buffer overflow & connection drops on mobile
      const CHUNK_SIZE = 8192;
      const reader = new FileReader();
      let offset = 0;

      reader.onload = (e) => {
        if (!dataChannel || dataChannel.readyState !== "open") return;

        // Backpressure check to prevent sending faster than buffer can handle
        try {
          dataChannel.send(e.target.result);
          offset += e.target.result.byteLength;
          progressBar.value = (offset / file.size) * 100;

          if (offset < file.size) {
            readNextChunk();
          } else {
            document.getElementById('fileNameDisplay').innerText = `File "${file.name}" sent successfully!`;
          }
        } catch (err) {
          console.error("Send error: ", err);
          alert("File sending failed due to connection drop!");
        }
      };

      function readNextChunk() {
        // Prevent queue congestion by waiting if bufferedAmount is high
        if (dataChannel.bufferedAmount > 65536) {
          setTimeout(readNextChunk, 50);
          return;
        }
        const slice = file.slice(offset, offset + CHUNK_SIZE);
        reader.readAsArrayBuffer(slice);
      }
      readNextChunk();
    }

    function handleIncomingData(data) {
      if (typeof data === 'string') {
        const message = JSON.parse(data);
        if (message.type === 'META') {
          incomingFileMeta = message;
          incomingBuffer = [];
          receivedSize = 0;
          document.getElementById('transferProgress').style.display = "block";
        }
      } else {
        incomingBuffer.push(data);
        receivedSize += data.byteLength;

        const progress = (receivedSize / incomingFileMeta.size) * 100;
        document.getElementById('transferProgress').value = progress;

        if (receivedSize === incomingFileMeta.size) {
          const blob = new Blob(incomingBuffer, { type: incomingFileMeta.fileType });
          const url = URL.createObjectURL(blob);
          
          const downloadContainer = document.getElementById('downloadContainer');
          downloadContainer.innerHTML = ''; 

          const autoAnchor = document.createElement('a');
          autoAnchor.href = url;
          autoAnchor.download = incomingFileMeta.name;
          document.body.appendChild(autoAnchor);

          try {
            // Attempt automatic download/save
            autoAnchor.click();
            document.body.removeChild(autoAnchor);
            document.getElementById('transferProgress').style.display = "none";
            document.getElementById('fileNameDisplay').innerText = `File "${incomingFileMeta.name}" received & auto-saved!`;
          } catch (e) {
            // If browser blocks auto-download policy, explicitly show download button
            const a = document.createElement('a');
            a.href = url;
            a.download = incomingFileMeta.name;
            a.innerHTML = `<i class="fa-solid fa-download"></i> Download File: ${incomingFileMeta.name}`;
            a.style.display = "block";
            a.style.marginTop = "10px";
            a.style.padding = "10px";
            a.style.background = "rgba(6, 182, 212, 0.2)";
            a.style.border = "1px solid #06b6d4";
            a.style.borderRadius = "12px";
            a.style.color = "#06b6d4";
            a.style.fontWeight = "bold";
            a.style.textDecoration = "none";
            
            downloadContainer.appendChild(a);
            document.getElementById('transferProgress').style.display = "none";
            document.getElementById('fileNameDisplay').innerText = `Browser policy blocked auto-save. Please click download below:`;
          }
        }
      }
    }
  </script>
</body>
</html>
